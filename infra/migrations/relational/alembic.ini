# Alembic, relational database only.
#
# There are TWO migration trees in this repository and they must never be
# merged. See CLAUDE.md, "Database".
#
#   infra/migrations/telemetry/  -> TimescaleDB: ingest index, archive index,
#                                   ingest_events, drone_state (P1-04)
#   infra/migrations/relational/ -> PostgreSQL/PostGIS: the schema in
#                                   ARCHITECTURE.md §5 (P2-01)
#
# They have separate version tables, separate heads and separate databases.
# A single tree would let a migration meant for one run against the other.

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/../../..
# `os` for both, so a Windows path containing a colon (D:\...) is not split on
# it. Alembic warns when this is unset and falls back to splitting on spaces,
# commas and colons - and the suite runs with warnings as errors.
path_separator = os
version_path_separator = os
version_locations = %(here)s/versions

# The URL is not written here. It comes from DATABASE_URL via
# env.py, so the credentials live in the environment and never in the repo.
sqlalchemy.url =

# The version table is named for its tree, so pointing this at the wrong
# database fails loudly instead of appearing to be an empty history.
version_table = alembic_version_relational

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
