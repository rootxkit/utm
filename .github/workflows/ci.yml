name: CI

on:
  push:
  pull_request:
    branches: [main]
  # The sitl job is gated to pull requests because it builds ArduPilot, which
  # makes its first failure a 60-minute discovery inside a PR - the worst
  # place to find one. This adds a button, not a weaker gate: pushes still
  # skip it.
  workflow_dispatch:

# A superseded run on the same branch has nothing left to tell us.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install workspace
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check .

      # gateway and airspace are safety-relevant, so a type error here is a
      # build failure rather than a warning.
      - name: mypy
        run: mypy

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install workspace
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      # Branch coverage, not line coverage. A test that passes without ever
      # executing the path it claims to cover has happened three times in this
      # repository; an unexecuted branch arc is what makes that visible.
      - name: pytest with branch coverage
        run: pytest -m 'not sitl and not slow and not postgres and not nats and not redis' --cov --cov-branch --cov-report=term-missing:skip-covered --cov-report=xml

      # Ratchets, set just under the measured figures. They catch a regression;
      # they are not a target. Raise them as coverage rises.
      - name: Coverage gate - agent/
        run: coverage report --include='agent/*' --show-missing --fail-under=95

      # The database-only modules are omitted here and gated in the `database`
      # job instead: their tests need a database this job does not have, so
      # counting them would ratchet against coverage never measured.
      - name: Coverage gate - gateway/
        run: coverage report --include='gateway/*' --omit='gateway/ingest_store_pg.py,gateway/retention.py,gateway/binding.py,gateway/state_writer.py,gateway/firmware_store.py' --show-missing --fail-under=92

      - name: Coverage gate - tools/mavlink_probe.py
        run: coverage report --include='tools/mavlink_probe.py' --show-missing --fail-under=35

      # Slow tests need nothing external, so they belong here rather than in
      # the SITL job - a failure there would look like a SITL problem.
      - name: Slow tests
        run: pytest -m slow -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The SITL launcher and the commit-msg hook are executable code on the
      # critical path of every developer's day; they get linted too.
      - name: shellcheck
        run: shellcheck sim/run_sitl.sh sim/stop_sitl.sh .githooks/commit-msg infra/basemap/fetch_basemap.sh infra/deploy/make_env.sh infra/deploy/backup.sh infra/deploy/restore_check.sh infra/deploy/deploy.sh

      - name: Scripts are executable
        run: |
          for f in sim/run_sitl.sh sim/stop_sitl.sh .githooks/commit-msg infra/basemap/fetch_basemap.sh infra/deploy/make_env.sh infra/deploy/backup.sh infra/deploy/restore_check.sh infra/deploy/deploy.sh; do
            test -x "$f" || { echo "$f is not executable"; exit 1; }
          done

  console:
    name: Operator console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-pilot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-pilot/package-lock.json

      - name: Install
        run: npm ci

      # Types come from the committed openapi.json; that it matches the API
      # is checked by api/tests/test_openapi_export.py in the unit tests.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint and format
        run: npm run lint

      - name: Build
        run: npm run build

  database:
    name: Telemetry database and bus
    runs-on: ubuntu-latest
    services:
      nats:
        # Same image as infra/docker-compose.dev.yml.
        image: nats:2.10-alpine
        ports:
          - 4222:4222
      redis:
        # Same image as infra/docker-compose.dev.yml.
        image: redis:7-alpine
        ports:
          - 6379:6379
      timescale:
        # Same image as infra/docker-compose.dev.yml. A different one would
        # test a database nobody runs.
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: courier
          POSTGRES_PASSWORD: courier_dev
          POSTGRES_DB: courier_telemetry
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U courier -d courier_telemetry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 36
          --health-start-period 40s
      postgres:
        # P2-01: the relational database, same image as the compose stack.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: courier
          POSTGRES_PASSWORD: courier_dev
          POSTGRES_DB: courier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U courier -d courier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 20s
    env:
      DATABASE_URL: postgresql+asyncpg://courier:courier_dev@localhost:5432/courier
      RELATIONAL_TEST_DATABASE_URL: postgresql+asyncpg://courier:courier_dev@localhost:5432/courier_test
      TELEMETRY_DATABASE_URL: postgresql+asyncpg://courier:courier_dev@localhost:5433/courier_telemetry
      # Tests create and drop this one themselves; the fixture refuses any
      # name that does not end in _test.
      TELEMETRY_TEST_DATABASE_URL: postgresql+asyncpg://courier:courier_dev@localhost:5433/courier_telemetry_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install workspace
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      # The service container runs no initdb scripts, so the extensions the
      # compose stack installs are created here instead. psql is already on the
      # runner image, so this needs no extra dependency.
      - name: Create extensions
        env:
          PGPASSWORD: courier_dev
        run: |
          for extension in timescaledb postgis btree_gist; do
            psql -h localhost -p 5433 -U courier -d courier_telemetry -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS $extension"
          done

      # Up, down and up again. A migration that cannot be reversed is found
      # here rather than during an incident.
      - name: Migrations run clean up and down
        run: |
          alembic -c infra/migrations/telemetry/alembic.ini upgrade head
          alembic -c infra/migrations/telemetry/alembic.ini downgrade base
          alembic -c infra/migrations/telemetry/alembic.ini upgrade head

      # P2-01. The other tree, against the other database. Never merged.
      - name: Relational migrations run clean up and down
        run: |
          alembic -c infra/migrations/relational/alembic.ini upgrade head
          alembic -c infra/migrations/relational/alembic.ini downgrade base
          alembic -c infra/migrations/relational/alembic.ini upgrade head

      - name: Bus tests
        env:
          NATS_URL: nats://localhost:4222
        run: pytest -m nats -v

      - name: Live state tests
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pytest -m redis -v

      - name: Database tests
        run: pytest -m postgres -v --cov=gateway.ingest_store_pg --cov=gateway.retention --cov=gateway.binding --cov=gateway.state_writer --cov=gateway.firmware_store --cov-branch --cov-report=term-missing

      - name: Coverage gate - database-backed modules
        run: coverage report --include='gateway/ingest_store_pg.py,gateway/retention.py,gateway/binding.py,gateway/state_writer.py,gateway/firmware_store.py' --show-missing --fail-under=85


  compose:
    name: Dev stack reaches healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # P0-03's acceptance criterion, run for real: cold volumes to all four
      # services healthy. --wait fails the step if any healthcheck does not
      # pass, so no assertion is needed beyond the exit code.
      - name: make up
        run: make up

      - name: Extensions are installed
        run: |
          docker exec courier-postgres psql -U courier -d courier \
            -tAc "SELECT 1 FROM pg_extension WHERE extname = 'postgis'" | grep -q 1
          docker exec courier-timescale psql -U courier -d courier_telemetry \
            -tAc "SELECT 1 FROM pg_extension WHERE extname = 'timescaledb'" | grep -q 1

      - name: make down
        if: always()
        run: make down

  sitl:
    name: SITL integration
    # Expensive: it builds ArduPilot. Restricted to pull requests into main,
    # which is where a regression in the flight path must be caught, plus
    # manual dispatch so it can be proven green before the PR is opened.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Pin the firmware line the fleet actually flies. When the fleet moves,
      # this moves with it — the SITL that gates merges must be the SITL that
      # matches the aircraft.
      #
      # A tag, not a branch. `Copter-4.5` is `refs/heads/Copter-4.5` and moves
      # whenever ArduPilot touches the 4.5 maintenance line, so the previous
      # value was not a pin at all: two CI runs a week apart could build
      # different firmware with nothing in the diff to say so.
      #
      # The "matches the aircraft" claim above is still unverified: the
      # aircraft's firmware version is not in the archive, because
      # AUTOPILOT_VERSION is only sent on request and Stage 0 cannot ask. P1-11
      # makes it fleet data instead of something read off a screen.
      ARDUPILOT_REF: Copter-4.5.7
      SITL_INSTANCE_COUNT: "3"
      # CI test area. Real operating coordinates live in configuration, never
      # in the repository; this is a simulation fixture and nothing else.
      SITL_HOME: "41.7151,44.8271,605,0"
      SITL_SYSID_BASE: "1"
      SITL_OUT_PORT_BASE: "14560"
      # No QGC in CI, so there is nothing to fan out to.
      SITL_QGC_PORT: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Checkout ArduPilot
        uses: actions/checkout@v4
        with:
          repository: ArduPilot/ardupilot
          ref: ${{ env.ARDUPILOT_REF }}
          path: ardupilot
          submodules: recursive

      - name: Record ArduPilot revision
        id: ardupilot
        working-directory: ardupilot
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache ArduPilot build
        uses: actions/cache@v4
        with:
          path: |
            ardupilot/build
            ~/.ccache
          key: ardupilot-${{ runner.os }}-${{ steps.ardupilot.outputs.sha }}
          # Without these, moving ARDUPILOT_REF throws away the ccache as well
          # as the build tree, and the next run pays the full ~20 minutes from
          # cold. A partial restore keeps the compiler cache warm, so only what
          # actually changed is rebuilt.
          restore-keys: |
            ardupilot-${{ runner.os }}-

      # The apt list comes from ArduPilot's own
      # Tools/environment_install/install-prereqs-ubuntu.sh (BASE_PKGS and
      # SITL_PKGS) on the ref this job builds, so it tracks something
      # maintained upstream rather than a list invented here.
      #
      # That script is deliberately not run directly. `-y` does make it
      # non-interactive, so interactivity is not the objection - weight is. It
      # downloads a ~100 MB ARM cross-compiler this job never uses, installs
      # SFML/CSFML, xterm, matplotlib, scipy and opencv for the desktop tools,
      # adds the user to the dialout group and edits their shell profile. For a
      # headless SITL build that is minutes of runner time for nothing.
      #
      # apt packages are deliberately not version-pinned, unlike the pip ones.
      # Runner images drop superseded versions from the archive, so an exact
      # apt pin fails on the next image bump - the opposite of the stability
      # pinning is for.
      - name: Install ArduPilot build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache g++ gawk make wget libtool libxml2-dev libxslt1-dev python3-dev

      # Pins and their reasons live in the requirements file, next to the
      # packages they apply to. The setuptools pin in particular carries the
      # condition for removing it.
      - name: Install the DroneCAN and MAVLink toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sim/requirements-ardupilot-build.txt

      - name: Build ArduCopter SITL
        working-directory: ardupilot
        run: |
          ./waf configure --board sitl
          ./waf copter

      - name: Install workspace
        run: |
          python -m pip install -e '.[dev,sitl]'

      - name: Launch SITL vehicles
        env:
          SIM_VEHICLE: ${{ github.workspace }}/ardupilot/Tools/autotest/sim_vehicle.py
        run: ./sim/run_sitl.sh -n "$SITL_INSTANCE_COUNT"

      - name: SITL integration tests
        run: pytest -m sitl -v

      - name: Stop SITL vehicles
        if: always()
        run: ./sim/stop_sitl.sh

      - name: Upload SITL logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sitl-logs
          path: sim/out/
          retention-days: 7
