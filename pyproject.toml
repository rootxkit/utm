[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "courier"
version = "0.1.0"
description = "National drone-flight monitoring: telemetry, Remote ID, airspace alerts"
requires-python = ">=3.12"
dependencies = [
    # Environment configuration is validated at startup rather than read
    # ad hoc; see common/config.py.
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    # The ground relay's uplink. relay-v1 is a WebSocket protocol, and the
    # relay must run on a pilot's bare Windows laptop where a C toolchain is
    # not available, so a pure-Python client matters.
    "websockets>=13",
    # The Gateway's index of what it has stored. Async because the ingest path
    # is asyncio end to end and a blocking driver would stall every station on
    # one slow query.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    # Schema is owned by migrations, never by hand (CLAUDE.md). Two trees: this
    # dependency serves both.
    "alembic>=1.13",
    # Raw archive compression. The archive is opaque bytes nobody queries, so
    # it is compressed on the way to disk; zstd is the ratio/speed point that
    # keeps fsync-per-batch affordable.
    "zstandard>=0.22",
    # The internal bus. The console subscribes to it rather than polling the
    # hypertable, so a browser refresh never becomes a database query.
    "nats-py>=2.6",
    # Live drone state, P1-05. The asyncio client, because the Gateway is
    # asyncio end to end; the TTL on each key is the definition of link lost.
    "redis>=5.0",
    # The REST/WS API, per the stack table in CLAUDE.md. P1-08 needs only the
    # WebSocket half; the OpenAPI schema it generates becomes the source of
    # truth for the TypeScript clients in Phase 6.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # The Gateway parses MAVLink with it (gateway/classify.py). It was listed
    # as a development extra, which every developer machine installs, so its
    # absence showed only when the first production image started (P0-09).
    "pymavlink>=2.4.40",
    # U-02: the network Remote ID ingest is an ASTM F3411 Display Provider,
    # an HTTPS client of USSPs. Async, because the adapter is asyncio; it was
    # already the dev dependency the API tests drive FastAPI with.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # Drives the FastAPI app in-process for the console feed tests, so they
    # need no free port and no running server.
    "httpx>=0.27",
]
sitl = [
    # Reading MAVLink from simulated vehicles in the integration job. Message
    # and field names are taken from the dialect definitions shipped here.
    # Also a runtime dependency; declared here so the integration job's
    # dependency is visible at the place that needs it.
    "pymavlink>=2.4.40",
]

[tool.setuptools]
# Each service is a top-level package rather than a src/ layout, so the
# directory names in CLAUDE.md and the import names are the same thing.
packages = ["common", "agent", "gateway", "api", "airspace"]

# --- ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["sim/out", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # shadowed builtins
    "C4",        # comprehensions
    "DTZ",       # naive datetimes — every timestamp here is UTC-aware
    "T20",       # no print(): logging goes through common.logging
    "SIM",       # simplify
    "PTH",       # pathlib over os.path
    "RUF",
]
ignore = [
    "E501",      # line length is the formatter's job
]

[tool.ruff.lint.per-file-ignores]
# Tests may shadow builtins in fixtures and assert on private helpers. T201
# because a test that measures something has to be able to report the number:
# the point of agent/tests/test_halfopen.py is the detection time it prints.
"**/tests/**" = ["A", "B008", "T201"]
# tools/ holds CLI diagnostics whose stdout IS the deliverable: the operator
# runs them at the ground station and pastes the output into a decision record.
# Structured JSON logging would defeat the purpose, and listen mode must stay
# standard-library only so it runs on a machine with no venv. T201 only — every
# other rule applies here as it does everywhere else.
"tools/**" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
docstring-code-format = true

# --- mypy -------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["common", "agent", "gateway", "api", "airspace", "tools"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
show_error_codes = true

# gateway and airspace are safety-relevant: a type error there is a build
# failure, not a warning. common is included because both import it, so a
# loose type in common defeats the point of checking them strictly. api is
# included because it is the sign-in boundary and the only writer of the
# fleet registry and its telemetry projection.
#
# `strict = true` is NOT used here. In mypy it is a global flag, and setting it
# inside a per-module override silently turns strict on for every module —
# verified against mypy 2.3.1, where an untyped def in api/ was reported under
# an override naming only gateway. The bundle is expanded instead so it applies
# where it is meant to and nowhere else. The remaining strict flags
# (warn_redundant_casts, warn_unused_ignores, no_implicit_reexport,
# warn_unused_configs) are already on globally above.
# pymavlink ships neither stubs nor a py.typed marker. It is the reference for
# MAVLink message and field names (CLAUDE.md rule 4), so it is not replaceable;
# the import is untyped and the code around it is not.
[[tool.mypy.overrides]]
module = ["pymavlink.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "common.*",
    "gateway.*",
    "airspace.*",
    "tools.*",
    "agent.*",
    "api.*",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
strict_equality = true
extra_checks = true

# --- pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
    "common",
    "agent",
    "gateway",
    "api",
    "airspace",
    "tools",
]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
# Two reasons a test is excluded from the default run, and they are not the
# same reason. Conflating them makes a job's failures ambiguous: a slow test
# that needs no SITL, running in the SITL job, produces a red build that looks
# like a SITL problem and is not.
markers = [
    "sitl: requires running SITL vehicles; needs an external dependency the default run does not have",
    "slow: takes tens of seconds but has no external dependency; excluded to keep the default run quick",
    "postgres: needs the telemetry database from `make up` and TELEMETRY_DATABASE_URL; excluded from the default run for the same reason as sitl",
    "nats: needs the NATS broker from `make up` and NATS_URL; excluded from the default run for the same reason as postgres",
    "redis: needs Redis from `make up` and REDIS_URL; excluded from the default run for the same reason as postgres",
]
filterwarnings = ["error"]

# --- coverage ---------------------------------------------------------------

[tool.coverage.run]
# Branch coverage, not just line coverage. Three times now a test has passed
# while never executing the path it claimed to cover - the PARAM_VALUE offset
# that could only ever report TELEMETRY-ONLY, and the 401 path the stub
# rejected with a WebSocket close. Line coverage would have called all of those
# covered. An unexecuted branch arc is the signal that catches them.
branch = true
source = ["common", "gateway", "airspace", "tools", "agent"]
# Measuring the tests themselves inflates the total towards 100% and hides the
# code that matters: a test file is, by construction, almost fully executed.
#
# The other entries are process entry points and operator scripts: argument
# parsing, settings loading and wiring, with every decision they make living in
# a module that is covered. Counting them measures how much composition there
# is, not how much of the system is tested, and the pressure it creates is to
# put logic somewhere else rather than to test it.
#
# agent/__main__.py is deliberately NOT here: it has tests in
# agent/tests/test_cli.py, because the refusal messages a pilot reads at a
# flying site are behaviour, not wiring.
#
# The line to hold: anything here must be composition only. gateway/pipeline.py
# was pulled OUT of this list and given tests when it turned out to carry real
# decisions - which unclaimed sources are announced, and what happens when a
# conversion fails.
omit = [
    "*/tests/*",
    "*/conftest.py",
    "gateway/__main__.py",
    "tools/register_aircraft.py",
    "tools/refresh_mavlink_units.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
# A ratchet, set just under the measured figure rather than at an aspiration.
# Its job is to catch a regression, not to express a target: the number goes up
# as coverage goes up, and never down without a reason written in the commit.
#
# Measured 2026-09-21 with --cov-branch and tests omitted:
#   everything     69%
#   agent/         84%
#   mavlink_probe  36%
#
# Re-measured 2026-09-22 after covering the paths that had never executed:
#   everything     73%
#   agent/         97%
#
# Re-measured again the same day, after the exclusive-bind and capture-analysis
# work:
#   everything     76%
#   agent/         96%
#   analyze_capture 96%
#
# The margin below each figure absorbs the integration tests, whose timing
# decides whether a reconnect branch runs at all on a loaded CI machine. A gate
# that fails at random teaches people to re-run the build, which is worse than
# no gate.
#
# agent/ and tools/mavlink_probe.py are gated separately and more tightly by
# `make cover`; see the Makefile. TASKS.md's 80% for gateway and airspace
# applies once those modules have behaviour (P1-02).
fail_under = 75
